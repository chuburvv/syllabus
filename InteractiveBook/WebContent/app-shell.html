<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Book</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Interactive Book">
  <meta name="theme-color" content="#1c1c1e">
  <link rel="apple-touch-icon" href="../Assets.xcassets/AppIcon.appiconset/AppIcon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #tts-fab, #tts-settings {
      position: fixed;
      z-index: 9999;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(28,28,30,0.85);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #tts-fab { right: 16px; bottom: 24px; }
    #tts-settings { right: 16px; bottom: 80px; width: 36px; height: 36px; font-size: 16px; opacity: 0.7; }
  </style>
</head>
<body>
  <iframe src="index.html" title="Interactive Book"></iframe>
  <button id="tts-fab" aria-label="Озвучить текст">🔊</button>
  <button id="tts-settings" aria-label="Настройки озвучки">⚙</button>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.error('SW registration failed:', err));
      });
    }
  </script>
  <script src="tts.js"></script>
</body>
</html>
